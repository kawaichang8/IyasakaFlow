# ==============================================
# CRM App - Docker Compose
# 開発環境用データベース設定
# ==============================================
# 注: Docker Compose V2 では version は不要です

services:
  # PostgreSQLデータベース
  postgres:
    image: postgres:16-alpine
    container_name: crm_app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin（データベース管理UI）- オプション
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: crm_app_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@crm-app.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
